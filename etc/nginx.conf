server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Vite filenames include a content hash, so these can be cached indefinitely. Missing assets
    # must return 404: falling back to index.html serves text/html to a module request and hides the
    # real deployment/cache problem behind a MIME-type error.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Every client-side route serves the same deployment-specific index. It references hashed
    # bundles which disappear on the next container rollout, so neither browsers nor the CDN may
    # retain an old copy of this HTML.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
