server {
    listen 80;
    server_name localhost;
    # Keep redirects relative so reverse proxies and Docker port mappings retain the public port.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Compress generated HTML/data and JavaScript at the origin. Cloudflare may recompress this to
    # Brotli for supported clients, while direct Docker/origin traffic still benefits from gzip.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Exact legacy entity URLs are generated from the same library data as the sitemap. `return`
    # keeps this a real HTTP redirect for browsers and crawlers, before any SPA fallback applies.
    if ($powercalc_legacy_redirect != "") {
        return 301 $powercalc_legacy_redirect;
    }

    # Collection names are plural in canonical URLs. These pattern redirects also cover entities
    # added after the redirect map was generated, which happens at image build time rather than on
    # every content refresh.
    location ~ ^/author/([^/]+)/?$ {
        return 301 /contributors/$1;
    }

    location ~ ^/manufacturer/([^/]+)/?$ {
        return 301 /manufacturers/$1;
    }

    # Vite filenames include a content hash, so these can be cached indefinitely. Missing assets
    # must return 404: falling back to index.html serves text/html to a module request and hides the
    # real deployment/cache problem behind a MIME-type error.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Avatar file names contain a content fingerprint, so changed images receive a new URL.
    location /avatars/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cloudflare-CDN-Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Profile cards are regenerated with the hourly library refresh. Keep their predictable URLs
    # briefly cacheable so shares are fast without leaving changed measurements stale for long.
    location /social-cards/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=300" always;
        add_header Cloudflare-CDN-Cache-Control "public, max-age=86400, stale-while-revalidate=300" always;
    }

    # Browsers always revalidate generated documents. Cloudflare may keep them for one day; the
    # hourly refresh rewrites embedded library and analytics data, then purges and warms these URLs.
    location ~* \.(html|data)$ {
        add_header Cache-Control "no-cache" always;
        add_header Cloudflare-CDN-Cache-Control "public, max-age=86400, stale-while-revalidate=300" always;
    }

    # Never let missing crawler-facing files silently turn into the SPA shell.
    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        default_type application/xml;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Cloudflare-CDN-Cache-Control "public, max-age=86400, stale-while-revalidate=300" always;
    }

    # These are the route shapes owned by React Router. A generated document wins; the SPA fallback
    # lets routes added to the API since the last refresh resolve through their live client loader.
    location ~ ^/(profiles/[^/]+/[^/]+|manufacturers(|/[^/]+)|contributors(|/[^/]+)|device-types(|/[^/]+)|whats-new|contribute|about|measurement-quality|statistics(|/(top-measure-devices|top-contributors|top-manufacturers|top-device-types|weekly-contributions))|analytics(|/sensor-dimensions(|/[^/]+)|/installations|/profiles|/time-series))/?$ {
        # Do not probe `$uri` itself: prerendered routes are directories and Nginx would redirect
        # their slashless canonical URL to the directory URL before serving its index document.
        try_files $uri/index.html /__spa-fallback.html;
        add_header Cache-Control "no-cache" always;
        add_header Cloudflare-CDN-Cache-Control "public, max-age=86400, stale-while-revalidate=300" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
