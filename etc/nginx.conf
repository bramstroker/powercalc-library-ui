# Query strings describe client UI state and have unbounded combinations. Do not create CDN
# variants that a finite URL purge cannot invalidate (including React Router's _routes parameter).
map $args $document_cdn_cache_control {
    "" "public, max-age=86400, stale-while-revalidate=300";
    default "no-store";
}

server {
    listen 80;
    server_name localhost;
    # Keep redirects relative so reverse proxies and Docker port mappings retain the public port.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Locations with their own add_header directives do not inherit these, so those locations
    # repeat this include alongside their cache headers below.
    include /etc/nginx/security-headers.conf;

    # Compress generated HTML/data and JavaScript at the origin. Cloudflare may recompress this to
    # Brotli for supported clients, while direct Docker/origin traffic still benefits from gzip.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/x-script application/javascript application/json application/xml image/svg+xml;

    # Exact legacy entity URLs are generated from the same library data as the sitemap. `return`
    # keeps this a real HTTP redirect for browsers and crawlers, before any SPA fallback applies.
    if ($powercalc_legacy_redirect != "") {
        return 301 $powercalc_legacy_redirect$is_args$args;
    }

    # Collection names are plural in canonical URLs.
    location ~ ^/author/([^/[:cntrl:]]+)/?$ {
        return 301 /contributors/$1$is_args$args;
    }

    location ~ ^/manufacturer/([^/[:cntrl:]]+)/?$ {
        return 301 /manufacturers/$1$is_args$args;
    }

    # Static file families moved under /assets/. `$request_uri` keeps the original encoding.
    location /avatars/ {
        return 301 /assets$request_uri;
    }

    # Vite filenames include a content hash, so these can be cached indefinitely. Missing assets
    # must return 404: falling back to index.html serves text/html to a module request and hides the
    # real deployment/cache problem behind a MIME-type error.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Avatar file names contain a content fingerprint, so changed images receive a new URL.
    location /assets/avatars/ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cloudflare-CDN-Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Flag URLs are stable and only change when the flag-icons package is upgraded.
    location /assets/flags/ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Cloudflare-CDN-Cache-Control "public, max-age=2592000" always;
    }

    # Profile cards are regenerated with the hourly library refresh. Keep their predictable URLs
    # briefly cacheable so shares are fast without leaving changed measurements stale for long.
    location /social-cards/ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=300" always;
        add_header Cloudflare-CDN-Cache-Control $document_cdn_cache_control always;
    }

    # Browsers always revalidate generated documents. Cloudflare may keep them for one day; the
    # hourly refresh rewrites embedded library and analytics data, then purges and warms these URLs.
    location ~* \.(html|data)$ {
        types { text/html html; text/x-script data; }
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Cloudflare-CDN-Cache-Control $document_cdn_cache_control always;
    }

    # Never let missing crawler-facing files silently turn into the SPA shell.
    location = /.content-manifest.json { return 404; }
    location = /.redirects.json { return 404; }
    location = /__spa-fallback.html { return 404; }

    location = /robots.txt {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        default_type application/xml;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = / {
        try_files /index.html =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Cloudflare-CDN-Cache-Control $document_cdn_cache_control always;
    }

    # Only published documents exist on the static site. New entities become available on the
    # next hourly refresh; unknown or removed entities must not return a 200 loading shell.
    location ~ ^/(profiles/[^/]+/[^/]+|manufacturers(|/[^/]+)|contributors(|/[^/]+)|device-types(|/[^/]+)|whats-new|contribute|about|measurement-quality|statistics(|/(top-measure-devices|top-contributors|top-manufacturers|top-device-types|weekly-contributions))|analytics(|/sensor-dimensions(|/[^/]+)|/installations|/profiles|/time-series))/?$ {
        # Do not probe `$uri` itself: prerendered routes are directories and Nginx would redirect
        # their slashless canonical URL to the directory URL before serving its index document.
        try_files $uri/index.html =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Cloudflare-CDN-Cache-Control $document_cdn_cache_control always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
