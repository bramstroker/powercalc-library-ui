services:
  library_ui:
    image: ghcr.io/bramstroker/powercalc-library-ui:${IMAGE_TAG:?IMAGE_TAG must name the deployed build}
    restart: unless-stopped
    ports:
      - "3001:80"

  # Deliberately behind a profile: `up` never starts it. The content refresh runs
  # `docker compose run --rm renderer`, which writes the regenerated documents into ./documents for
  # the workflow to copy into the running container.
  renderer:
    image: ghcr.io/bramstroker/powercalc-library-renderer:${IMAGE_TAG:?IMAGE_TAG must name the deployed build}
    profiles: ["render"]
    volumes:
      - ./documents:/documents
