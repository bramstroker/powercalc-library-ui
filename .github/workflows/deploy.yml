name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read

env:
  UI_IMAGE: ghcr.io/${{ github.repository_owner }}/powercalc-library-ui
  RENDERER_IMAGE: ghcr.io/${{ github.repository_owner }}/powercalc-library-renderer
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # Gate the deploy on the same checks that run for pull requests, so a red suite cannot ship.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Install Nginx for HTTP routing tests
        run: sudo apt-get update && sudo apt-get install -y nginx

      - name: Run unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # Builds and pushes while the tests run. Images are tagged by commit, so pushing an untested build
  # is harmless: nothing runs it until `deploy` selects that tag, after every test job has passed.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" -t "$UI_IMAGE:$IMAGE_TAG" .

      # Same build, kept as a separate image: it renders the documents again for the hourly
      # content refresh, so it has to stay in lockstep with the assets this deploy ships.
      - name: Build renderer image
        run: docker build --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" --target renderer -t "$RENDERER_IMAGE:$IMAGE_TAG" .

      - name: Push Docker images
        run: |
          docker push "$UI_IMAGE:$IMAGE_TAG"
          docker push "$RENDERER_IMAGE:$IMAGE_TAG"

  deploy:
    concurrency:
      group: library-production
      cancel-in-progress: false
    needs: [checks, e2e, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure SSH host verification
        # Provision this from a trusted source; never populate it with ssh-keyscan during the job.
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/powercalc-deploy-ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa" "$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts"
          test -s "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa"
          test -s "$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts"

      # Staged under another name: the hourly refresh reads the live compose file, so it only moves
      # into place once the images it names are on the server and running.
      - name: Transfer Docker Compose file to remote server
        run: |
          scp -i "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts" \
            docker-compose.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.REMOTE_SERVER_ADDRESS }}:${{ secrets.REMOTE_SERVER_PATH }}/docker-compose.next.yml

      # `IMAGE_TAG` is persisted in `.env` only after the containers are up, so the renderer the
      # hourly refresh runs always matches the build the site is serving. Only the newest five
      # builds of each image are kept on the server, as rollback targets.
      - name: Deploy Docker containers using Docker Compose on remote server
        run: |
          ssh -i "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts" \
            ${{ secrets.SSH_USER }}@${{ secrets.REMOTE_SERVER_ADDRESS }} << 'ENDSSH'
          set -e
          cd ${{ secrets.REMOTE_SERVER_PATH }}
          export IMAGE_TAG=${{ env.IMAGE_TAG }}
          docker compose -f docker-compose.next.yml --profile render pull
          docker compose -f docker-compose.next.yml up -d
          mv docker-compose.next.yml docker-compose.yml
          touch .env
          { grep -v '^IMAGE_TAG=' .env || true; echo "IMAGE_TAG=$IMAGE_TAG"; } > .env.next
          mv .env.next .env
          for image in ${{ env.UI_IMAGE }} ${{ env.RENDERER_IMAGE }}; do
            docker image ls "$image" --format '{{.Repository}}:{{.Tag}}' | tail -n +6 | xargs -r docker image rm || true
          done
          ENDSSH

      - name: Purge Cloudflare cache
        env:
          # Deliberately omit PURGE_URLS: every SPA deep link is a separate Cloudflare cache key.
          # Use a scoped API token with only Zone.Cache Purge access for this zone.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE}/purge_cache" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            | jq --exit-status '.success == true'

      - name: Setup Node.js for cache warm-up
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Warm prerendered pages in Cloudflare
        env:
          WARM_SITE_URL: https://library.powercalc.nl
          WARM_CONCURRENCY: "12"
        run: npm run cache:warm
