name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Gate the deploy on the same checks that run for pull requests, so a red suite cannot ship.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

  deploy:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Docker image
        run: docker build -t powercalc-library-ui:latest .

      # Same build, kept as a separate image: it renders the documents again for the nightly
      # content refresh, so it has to stay in lockstep with the assets this deploy ships.
      - name: Build renderer image
        run: docker build --target renderer -t powercalc-library-renderer:latest .

      # Compressed because the renderer carries a Node runtime and the production dependencies,
      # which roughly triples what this step used to transfer. `docker load` unpacks gzip itself.
      - name: Save Docker images as tar file
        run: docker save powercalc-library-ui:latest powercalc-library-renderer:latest | gzip -1 > powercalc-library-ui.tar.gz

      - name: Configure SSH host verification
        # Provision this from a trusted source; never populate it with ssh-keyscan during the job.
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/powercalc-deploy-ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa" "$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts"
          test -s "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa"
          test -s "$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts"

      - name: Transfer Docker image to remote server
        run: |
          scp -i "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts" \
            powercalc-library-ui.tar.gz \
            ${{ secrets.SSH_USER }}@${{ secrets.REMOTE_SERVER_ADDRESS }}:${{ secrets.REMOTE_SERVER_PATH }}

      - name: Load Docker images on remote server
        run: |
          ssh -i "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts" \
            ${{ secrets.SSH_USER }}@${{ secrets.REMOTE_SERVER_ADDRESS }} << 'ENDSSH'
          docker load -i ${{ secrets.REMOTE_SERVER_PATH }}/powercalc-library-ui.tar.gz
          ENDSSH

      - name: Transfer Docker Compose file to remote server
        run: |
          scp -i "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts" \
            docker-compose.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.REMOTE_SERVER_ADDRESS }}:${{ secrets.REMOTE_SERVER_PATH }}

      - name: Deploy Docker containers using Docker Compose on remote server
        run: |
          ssh -i "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts" \
            ${{ secrets.SSH_USER }}@${{ secrets.REMOTE_SERVER_ADDRESS }} << 'ENDSSH'
          docker compose -f ${{ secrets.REMOTE_SERVER_PATH }}/docker-compose.yml up -d
          ENDSSH

      - name: Purge Cloudflare cache
        env:
          # Deliberately omit PURGE_URLS: every SPA deep link is a separate Cloudflare cache key.
          # Use a scoped API token with only Zone.Cache Purge access for this zone.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE}/purge_cache" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            | jq --exit-status '.success == true'

      - name: Setup Node.js for cache warm-up
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Warm prerendered pages in Cloudflare
        env:
          WARM_SITE_URL: https://library.powercalc.nl
          WARM_CONCURRENCY: "12"
        run: npm run cache:warm
