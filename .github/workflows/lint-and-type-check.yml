name: Lint and Type Check

on:
  # Pull requests only. A push to master runs the identical steps in the `checks` job that gates
  # `deploy.yml`, so keeping the `push` trigger here just ran the whole suite a second time.
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "25"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type checking
        run: npm run type-check
