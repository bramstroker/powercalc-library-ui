name: Refresh content

# The library and analytics data behind the prerendered pages change through the day, the
# application does not. This regenerates the documents against the build the server is already
# running: no image build, no container recreate, and every hashed asset keeps its URL, so open
# tabs keep working and Cloudflare only has to refetch what actually changed.
on:
  workflow_dispatch:
  schedule:
    # Every hour, at :17 past.
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  refresh:
    concurrency:
      group: library-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure SSH host verification
        # Provision this from a trusted source; never populate it with ssh-keyscan during the job.
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/powercalc-deploy-ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa" "$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts"
          test -s "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa"
          test -s "$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts"

      - name: Render documents on remote server
        run: |
          ssh -i "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts" \
            ${{ secrets.SSH_USER }}@${{ secrets.REMOTE_SERVER_ADDRESS }} << 'ENDSSH'
          set -e
          cd ${{ secrets.REMOTE_SERVER_PATH }}
          # Keep the last acknowledged manifest until publish, purge and warm all succeed. A
          # failed run is therefore retried on the next refresh instead of silently losing purges.
          rm -rf documents
          mkdir -p documents
          docker compose cp library_ui:/usr/share/nginx/html/.content-manifest.json documents/previous-manifest.json
          docker compose run --rm --user "$(id -u):$(id -g)" renderer
          docker compose cp documents/delta/. library_ui:/usr/share/nginx/html/
          docker compose exec -T library_ui sh -c 'while IFS= read -r file; do rm -f "/usr/share/nginx/html/$file"; done' < documents/removed.txt
          ENDSSH

      - name: Retrieve changed URL manifest
        run: |
          scp -i "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts" \
            ${{ secrets.SSH_USER }}@${{ secrets.REMOTE_SERVER_ADDRESS }}:${{ secrets.REMOTE_SERVER_PATH }}/documents/cache-plan.json \
            "$RUNNER_TEMP/library-cache-plan.json"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Purge and warm changed content
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
        run: node scripts/purge-content-cache.mjs "$RUNNER_TEMP/library-cache-plan.json"

      - name: Acknowledge completed refresh
        run: |
          ssh -i "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts" \
            ${{ secrets.SSH_USER }}@${{ secrets.REMOTE_SERVER_ADDRESS }} << 'ENDSSH'
          set -e
          cd ${{ secrets.REMOTE_SERVER_PATH }}
          docker compose cp documents/next-manifest.json library_ui:/usr/share/nginx/html/.content-manifest.json
          ENDSSH
