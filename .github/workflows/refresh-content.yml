name: Refresh content

# The library and analytics data behind the prerendered pages change through the day, the
# application does not. This regenerates the documents against the build the server is already
# running: no image build, no container recreate, and every hashed asset keeps its URL, so open
# tabs keep working and Cloudflare only has to refetch what actually changed.
on:
  workflow_dispatch:
  schedule:
    # Every hour, at :17 past.
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure SSH host verification
        # Provision this from a trusted source; never populate it with ssh-keyscan during the job.
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/powercalc-deploy-ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa" "$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts"
          test -s "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa"
          test -s "$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts"

      - name: Render documents on remote server
        run: |
          ssh -i "$RUNNER_TEMP/powercalc-deploy-ssh/id_rsa" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/powercalc-deploy-ssh/known_hosts" \
            ${{ secrets.SSH_USER }}@${{ secrets.REMOTE_SERVER_ADDRESS }} << 'ENDSSH'
          set -e
          cd ${{ secrets.REMOTE_SERVER_PATH }}
          # Start from empty: a page for an entity that has since left the library would otherwise
          # survive every later render and keep being copied into the container.
          rm -rf documents
          mkdir -p documents
          # As the calling user, so the next run can clear the directory again. Left to Docker, the
          # rendered files are owned by root and the `rm` above fails from then on.
          docker compose -f docker-compose.yml run --rm --user "$(id -u):$(id -g)" renderer
          docker compose -f docker-compose.yml cp documents/. library_ui:/usr/share/nginx/html/
          ENDSSH

      - name: Purge Cloudflare cache
        env:
          # Deliberately omit PURGE_URLS: every SPA deep link is a separate Cloudflare cache key.
          # Use a scoped API token with only Zone.Cache Purge access for this zone.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE}/purge_cache" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            | jq --exit-status '.success == true'

      - name: Setup Node.js for cache warm-up
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Warm prerendered pages in Cloudflare
        env:
          WARM_SITE_URL: https://library.powercalc.nl
          WARM_CONCURRENCY: "12"
        run: npm run cache:warm
